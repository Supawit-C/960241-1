<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 - Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100 py-4"
        style="max-width: 500px;">

        <img src="https://www.cmu.ac.th/content/Article/2023/7e6d8808-54b5-419d-b3da-99de6cce26f4/047c25cb-dee0-494e-b462-4f28f9e51ffd.jpg"
            alt="cmu logo" class="img-fluid mb-4" style="max-height: 120px;">

        <div class="btn-group mb-4 shadow-sm" role="group">
            <button type="button" class="btn btn-secondary px-4">Home</button>
            <button type="button" class="btn btn-danger px-4">Login</button>
        </div>

        <h1 class="mb-4 fw-bold">หน้า Login</h1>
        <form action="sucess.html" class="w-100 bg-white p-4 rounded shadow-sm">
            <div class="mb-3">
                <label for="name" class="form-label text-center w-100 fs-5">username</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Email">
            </div>
            <div class="mb-4">
                <label for="password" class="form-label text-center w-100 fs-5 mt-2">password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Password">
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <button type="submit" class="btn btn-primary px-4">Login</button>
                <a href="sigin.html" class="text-decoration-none text-primary">Sign In</a>
            </div>
        </form>
        <footer class="mt-5 text-center w-100">
            <p class="mb-1 text-muted small">page footer</p>
            <p class="mb-3 fw-medium">ที่อยู่ camt มช</p>
            <div class="ratio ratio-21x9 rounded overflow-hidden shadow-sm">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3777.1977799513076!2d98.95155107604314!3d18.800508660358994!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x30da3a652e75e1ad%3A0x6b4fb6c9656dbbe8!2sCollege%20of%20Arts%2C%20Media%20and%20Technology!5e0!3m2%2Fen!2sth!4v1710000000000!5m2%2Fen!2sth"
                    style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
